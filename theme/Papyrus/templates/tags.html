{% extends "base.html" %}
{% block title %}{{ SITENAME }} | Tags{% endblock %}
{% set current = "tags" %}

{% block content %}
<div style="margin-bottom: 2em;">
    <h1 style="font-size: 1.75rem; margin: 0 0 0.5em 0;">Tags</h1>
    <ul class="mac-tags__list" style="gap: 6px;">
        {% for tag, articles in tags|sort %}
        <li class="mac-tags__item">
            <a href="{{ SITEURL }}/{{ tag.url }}">{{ tag }}</a>
            <sup style="margin-left: 2px; font-size: 9px; color: var(--mac-text-muted);">{{ articles|count }}</sup>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
